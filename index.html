<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marauder v6.1 - Panel de Control</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #0b0e14; /* Fondo súper oscuro tipo hacker */
        }
        .sidebar {
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #30363d;
            background-color: #0d1117;
        }
        .main-panel {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0b0e14;
        }
        .terminal-window {
            flex-grow: 1;
            background-color: #000000;
            color: #4af626; /* Verde terminal clásico */
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        /* Estilo para los botones de comando para que se vean compactos */
        .cmd-btn {
            font-size: 0.75rem;
            text-align: left;
            padding: 4px 8px;
        }
        .accordion-button {
            padding: 10px 15px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .accordion-body {
            padding: 10px;
        }
        .subcategory-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #8b949e;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
            border-bottom: 1px solid #21262d;
            padding-bottom: 2px;
        }
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0">
            
            <!-- ==================== BARRA LATERAL ==================== -->
            <div class="col-md-4 col-lg-3 col-xl-2 sidebar">
                
                <!-- Cabecera / Estado -->
                <div class="p-3 border-bottom border-secondary text-center">
                    <h5 class="mb-1 text-info fw-bold"><i class="bi bi-cpu"></i> MARAUDER v6.1</h5>
                    <div class="small text-muted mb-2">
                        <span id="statusDot" class="badge bg-danger me-1">●</span>
                        <span id="statusText">Desconectado</span>
                    </div>
                    <button class="btn btn-outline-info btn-sm w-100" id="btnConnect">
                        <i class="bi bi-plug"></i> Conectar USB
                    </button>
                </div>

                <!-- Menú Acordeón -->
                <div class="accordion accordion-flush" id="sidebarAccordion">
                    
                    <!-- WIFI -->
                    <div class="accordion-item bg-transparent border-secondary">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-dark text-info" type="button" data-bs-toggle="collapse" data-bs-target="#collapseWifi">
                                <i class="bi bi-wifi me-2"></i> WiFi
                            </button>
                        </h2>
                        <div id="collapseWifi" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                            <div class="accordion-body bg-dark">
                                
                                <div class="subcategory-title">Sniffers</div>
                                <div class="d-grid gap-1 mb-2">
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffprobe">Probe Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffbeacon">Beacon Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffdeauth">Deauth Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="packetcount">Packet Count</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffpmkid">PMKID Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="packetmonitor">Pkt Monitor</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="channelanalyzer">Ch Analyzer</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="channelsummary">Ch Summary</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffraw">Raw Capture</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="pwnagotchi">Pwnagotchi</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="pineapple">Pineapple</button>
                                </div>

                                <div class="subcategory-title">Scanners</div>
                                <div class="d-grid gap-1 mb-2">
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="scanall">Scan All</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="scanap">Scan AP</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="scansta">Scan STA</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="pingscan">Ping Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="arpscan">ARP Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="portscan">Port Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="sshescan">SSH Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="telnetscan">Telnet Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="smtpscan">SMTP Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="dnsscan">DNS Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="httpscan">HTTP Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="httpsscan">HTTPS Scan</button>
                                    <button class="btn btn-outline-info btn-sm cmd-btn" data-cmd="rdpscan">RDP Scan</button>
                                </div>

                                <div class="subcategory-title">Attacks</div>
                                <div class="d-grid gap-1 mb-2">
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="evilportal">Evil Portal</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="deauth">Deauth Flood</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="apclonespam">AP Clone Spam</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="deauthtarget">Deauth Targeted</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="karma">Karma</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="badmsg">Bad Msg</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="badmsgtarget">Bad Msg Targ</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="assocsleep">Assoc Sleep</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="assocsleeptarget">Assoc Slp Targ</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="saecommit">SAE Commit</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="channelswitch">Ch Switch</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="quiettime">Quiet Time</button>
                                </div>

                                <div class="subcategory-title">General</div>
                                <div class="d-grid gap-1">
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="clearstations">Clear Stations</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="selecthtml">Select HTML</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="selectap">Select APs</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="viewap">View AP Info</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="selectstation">Select Stations</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="join">Join WiFi</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="joinsaved">Join Saved</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="startap">Start AP</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="hostapinfo">Host AP Info</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="setmac">Set MACs</button>
                                    <button class="btn btn-outline-warning btn-sm cmd-btn" data-cmd="shutdown">Shutdown WiFi</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="loadwardrive">Load Wardrive</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="generatessids">Gen SSIDs</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="selectprobessids">Sel Probe SSIDs</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="addssids">Add SSIDs</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="clearssids">Clear SSIDs</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="clearaps">Clear APs</button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- BLUETOOTH -->
                    <div class="accordion-item bg-transparent border-secondary">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-dark text-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBluetooth">
                                <i class="bi bi-bluetooth me-2"></i> Bluetooth
                            </button>
                        </h2>
                        <div id="collapseBluetooth" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                            <div class="accordion-body bg-dark">
                                
                                <div class="subcategory-title">Sniffers</div>
                                <div class="d-grid gap-1 mb-2">
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffbt">BT Sniffer</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="sniffflipper">Flipper Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="findmy">FindMy Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="findmymonitor">FindMy Monitor</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="skimmer">Detect Skimmer</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="btanalyze">BT Analyze</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="flock">Flock Sniff</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="metadetect">Meta Detect</button>
                                    <button class="btn btn-outline-secondary btn-sm cmd-btn" data-cmd="foxhunt">Fox Hunt</button>
                                </div>

                                <div class="subcategory-title">Attacks</div>
                                <div class="d-grid gap-1">
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="sourapple">Sour Apple</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="applejuice">Apple Juice</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="swiftpair">Swiftpair Spam</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="samsungspam">Samsung Spam</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="googlespam">Google Spam</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="flipperspam">Flipper Spam</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="blespam">BLE Spam All</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="spoofairtag">Spoof AirTag</button>
                                    <button class="btn btn-outline-danger btn-sm cmd-btn" data-cmd="findmysound">FindMy Sound</button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- GPS -->
                    <div class="accordion-item bg-transparent border-secondary">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-dark text-success" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGPS">
                                <i class="bi bi-geo-alt me-2"></i> GPS
                            </button>
                        </h2>
                        <div id="collapseGPS" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                            <div class="accordion-body bg-dark">
                                <div class="d-grid gap-1">
                                    <button class="btn btn-outline-success btn-sm cmd-btn" data-cmd="gpsdata">GPS Data</button>
                                    <button class="btn btn-outline-success btn-sm cmd-btn" data-cmd="nmea">NMEA Stream</button>
                                    <button class="btn btn-outline-success btn-sm cmd-btn" data-cmd="tracker start">Start Tracker</button>
                                    <button class="btn btn-outline-success btn-sm cmd-btn" data-cmd="tracker stop">Stop Tracker</button>
                                    <button class="btn btn-outline-success btn-sm cmd-btn" data-cmd="gpspoi">GPS POI</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SISTEMA -->
                    <div class="accordion-item bg-transparent border-secondary">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-dark text-warning" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSystem">
                                <i class="bi bi-gear me-2"></i> Sistema
                            </button>
                        </h2>
                        <div id="collapseSystem" class="accordion-collapse collapse" data-bs-parent="#sidebarAccordion">
                            <div class="accordion-body bg-dark">
                                <div class="d-grid gap-1">
                                    <button class="btn btn-outline-warning btn-sm cmd-btn" data-cmd="info">Device Info</button>
                                    <button class="btn btn-outline-warning btn-sm cmd-btn" data-cmd="ls /">Listar SD</button>
                                    <button class="btn btn-outline-warning btn-sm cmd-btn" data-cmd="brightness">Brillo Pantalla</button>
                                    <button class="btn btn-outline-warning btn-sm cmd-btn" data-cmd="settings">Ajustes</button>
                                    <button class="btn btn-danger btn-sm cmd-btn mt-3" data-cmd="stopscan">
                                        <i class="bi bi-x-octagon"></i> DETENER TODO (stopscan)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> <!-- Fin Acordeón -->
            </div>

            <!-- ==================== PANEL PRINCIPAL ==================== -->
            <div class="col-md-8 col-lg-9 col-xl-10 main-panel p-3">
                
                <!-- Cabecera de la Terminal -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="m-0 text-light"><i class="bi bi-terminal text-info"></i> Consola de Operaciones</h4>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" id="btnExport"><i class="bi bi-download"></i> Exportar Log</button>
                        <button class="btn btn-sm btn-outline-secondary" id="btnClear"><i class="bi bi-trash"></i> Limpiar</button>
                    </div>
                </div>

                <!-- Ventana de la Terminal -->
                <div class="terminal-window" id="terminalOutput">> Esperando conexión con el ESP32 Marauder...</div>

                <!-- Área de Entrada -->
                <div class="input-group mt-3">
                    <span class="input-group-text bg-dark text-muted border-secondary">&gt;_</span>
                    <input type="text" id="commandInput" class="form-control bg-dark text-light border-secondary font-monospace" placeholder="Escribe un comando manual (ej. help)..." disabled>
                    <button class="btn btn-info fw-bold" id="btnSend" disabled><i class="bi bi-send"></i> Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle (necesario para el Acordeón) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- VARIABLES GLOBALES ---
        let port;
        let writer;
        let reader;
        let readLoopRunning = false;

        // --- ELEMENTOS DEL DOM ---
        const btnConnect = document.getElementById('btnConnect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const terminalOutput = document.getElementById('terminalOutput');
        const commandInput = document.getElementById('commandInput');
        const btnSend = document.getElementById('btnSend');
        const btnClear = document.getElementById('btnClear');
        const btnExport = document.getElementById('btnExport');

        // --- LÓGICA DE CONEXIÓN WEB SERIAL ---
        btnConnect.addEventListener('click', async () => {
            if (port) {
                // Desconectar
                try {
                    if (reader) await reader.cancel();
                    if (writer) writer.releaseLock();
                    await port.close();
                    port = null;
                    readLoopRunning = false;
                    
                    // UI Desconectado
                    statusDot.className = 'badge bg-danger me-1';
                    statusText.textContent = 'Desconectado';
                    btnConnect.innerHTML = '<i class="bi bi-plug"></i> Conectar USB';
                    btnConnect.className = 'btn btn-outline-info btn-sm w-100';
                    commandInput.disabled = true;
                    btnSend.disabled = true;
                    terminalOutput.innerHTML += '\n[!] Desconectado del puerto serie.\n';
                } catch (err) {
                    console.error("Error al desconectar:", err);
                }
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                writer = port.writable.getWriter();
                
                // UI Conectado
                statusDot.className = 'badge bg-success me-1';
                statusText.textContent = 'Conectado';
                btnConnect.innerHTML = '<i class="bi bi-x-circle"></i> Desconectar';
                btnConnect.className = 'btn btn-outline-danger btn-sm w-100';
                commandInput.disabled = false;
                btnSend.disabled = false;
                terminalOutput.innerHTML = '[+] Conectado a 115200 baudios. Esperando datos...\n';
                
                readLoopRunning = true;
                readLoop();

            } catch (err) {
                console.error("Error de conexión:", err);
                alert("Error al conectar. Asegúrate de que:\n1. El Marauder esté conectado por USB.\n2. Otro programa (como Arduino IDE o Putty) no esté usando el puerto.\n3. Estés usando Chrome o Edge.");
            }
        });

        // --- BUCLE DE LECTURA ---
        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (readLoopRunning) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        const cleanValue = value.replace(/\0/g, '');
                        terminalOutput.innerHTML += cleanValue;
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;
                    }
                }
            } catch (error) {
                if (readLoopRunning) console.error("Error de lectura:", error);
            } finally {
                reader.releaseLock();
            }
        }

        // --- ENVIAR COMANDOS ---
        async function sendCommand(cmd) {
            if (!writer || !port) return;
            
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + '\n'));
            
            terminalOutput.innerHTML += `\n<span class="text-warning">&gt; ${cmd}</span>\n`;
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Eventos de Botones
        document.querySelectorAll('.cmd-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cmd = btn.getAttribute('data-cmd');
                if (cmd) sendCommand(cmd);
            });
        });

        // Evento de Input Manual
        btnSend.addEventListener('click', () => {
            const cmd = commandInput.value.trim();
            if (cmd) {
                sendCommand(cmd);
                commandInput.value = '';
            }
        });

        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnSend.click();
        });

        // --- UTILIDADES ---
        btnClear.addEventListener('click', () => {
            terminalOutput.innerHTML = '> Terminal limpia.\n';
        });

        btnExport.addEventListener('click', () => {
            const text = terminalOutput.innerText;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `marauder_log_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
